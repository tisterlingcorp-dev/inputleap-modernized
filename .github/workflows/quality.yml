name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake pkg-config xvfb \
            libavahi-compat-libdnssd-dev libssl-dev \
            libice-dev libsm-dev libpng-dev \
            libx11-dev libxext-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxtst-dev libxkbcommon-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # Legacy network integration fixtures still retain connection objects
          # at process exit. ASan/UBSan remain strict; LSan gets a separate
          # cleanup phase instead of blocking this first quality gate.
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: xvfb-run -a ctest --preset asan

  rust-dependency-audit:
    name: Rust dependency audit
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check Rust workspace advisories, licenses, bans, and sources
        working-directory: rust
        run: cargo deny check

      - name: Check Windows Tauri advisories, licenses, bans, and sources
        working-directory: rust/apps/input-leap/src-tauri
        run: cargo deny check

      - name: Check standalone agent and server dependency policies
        shell: pwsh
        run: |
          foreach ($workspace in @('rust/bins/input-leap-agent', 'rust/bins/input-leap-server')) {
            Push-Location $workspace
            try { cargo deny check; if ($LASTEXITCODE -ne 0) { throw "cargo-deny failed for $workspace" } }
            finally { Pop-Location }
          }

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build cmake pkg-config clang-tidy \
            libavahi-compat-libdnssd-dev libssl-dev \
            libice-dev libsm-dev libpng-dev \
            libx11-dev libxext-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxtst-dev libxkbcommon-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools

      - name: Configure
        run: cmake --preset clang-tidy

      - name: Analyze while building
        run: cmake --build --preset clang-tidy --parallel
