name: Build tests

on:
  release:

  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release binaries'
        required: false
        type: boolean
      include_legacy_platforms:
        description: 'Also build Linux, macOS, FreeBSD and Flatpak (outside the Windows release scope)'
        required: false
        type: boolean
      upgrade_from_run_id:
        description: 'Optional successful Release workflow run ID whose Windows installer will be used to test upgrade and rollback'
        required: false
        type: string

# Set the build type here
env:
  B_BUILD_TYPE: ${{ (inputs.build_release || github.event_name == 'release') && 'Release' || 'Debug' }}
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux-build:
    if: ${{ inputs.include_legacy_platforms }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
       include:

         - name: ubuntu-22-04-clang
           os: "ubuntu:22.04"
           cc: "clang"
           cxx: "clang++"
           wayland: none
         - name: ubuntu-22-04
           os: "ubuntu:22.04"
           cc: "gcc"
           cxx: "g++"
           wayland: none
         - name: ubuntu-24-04
           os: "ubuntu:24.04"
           cc: "gcc"
           cxx: "g++"
           wayland: dist

         - name: debian-12
           os: "debian:bookworm"
           cc: "gcc"
           cxx: "g++"
           wayland: none
         - name: debian-12-latest-libei
           os: "debian:bookworm"
           cc: "gcc"
           cxx: "g++"
           wayland: latest
    steps:


      - name: Update and install packages
        run: |
          apt-get update -y
          apt-get dist-upgrade -y
          apt-get install -y \
                  cmake \
                  g++ \
                  clang \
                  git \
                  libavahi-compat-libdnssd-dev \
                  libgtest-dev \
                  libgl-dev \
                  libgmock-dev \
                  libice-dev \
                  libpng-dev \
                  libsm-dev \
                  libssl-dev \
                  libxinerama-dev \
                  libxrandr-dev \
                  libxtst-dev \
                  libxkbcommon-dev \
                  libglib2.0-dev \
                  python3-cryptography \
                  ninja-build \
                  python-is-python3

      - if: env.B_BUILD_TYPE == 'Release'
        name: Install release installer build packages
        run: |
          apt-get install -y \
                  debhelper \
                  devscripts \
                  xvfb

      - name: Install Qt6 packages
        run: |
          apt-get install -y \
                  qt6-base-dev \
                  qt6-l10n-tools \
                  qt6-tools-dev-tools \
                  qt6-tools-dev

      - if: matrix.wayland == 'latest'
        name: Install libei and libportal pre-reqs
        run: |
          apt-get install -y \
                  ca-certificates \
                  dbus \
                  gettext \
                  git \
                  libgirepository1.0-dev \
                  libglib2.0 \
                  libgtk-3-dev \
                  libprotobuf-c-dev \
                  libsystemd-dev \
                  meson \
                  protobuf-c-compiler \
                  protobuf-compiler \
                  python3-attr \
                  python3-dbusmock \
                  python3-jinja2 \
                  python3-pip \
                  python3-pytest \
                  python3-jinja2 \
                  valac

      - if: matrix.wayland == 'dist'
        name: Install libei and libportal distribution packages
        run: |
          apt-get install -y \
                libei-dev \
                libportal-dev

      # Code checkout steps
      - name: Checkout input-leap
        uses: actions/checkout@v7
        with:
          path: input-leap
          submodules: recursive
          set-safe-directory: ${{ github.workspace }}

      - if: matrix.wayland == 'latest'
        name: Get libei v1.3.0 from freedesktop
        # Manual checkout of libinput/libei ref 1.3.0 from https://gitlab.freedesktop.org
        # because actions/checkout does not support gitlab
        run: |
          git clone --depth=1 --branch="$ref" --recurse-submodules -- \
            "https://gitlab.freedesktop.org/libinput/libei" libei
        env:
          ref: 1.3.0

      - if: matrix.wayland == 'latest'
        name: Get libportal from upstream
        uses: actions/checkout@v7
        with:
          repository: flatpak/libportal
          # Debian 12 provides GLib 2.74; libportal main currently requires 2.80.
          ref: 0.9.1
          path: libportal

      - if: matrix.wayland == 'latest'
        name: build libei from git tag
        run: |
            meson setup -Dprefix=/usr -Dtests=disabled -Dliboeffis=disabled -Ddocumentation=[] libei _libei_builddir
            ninja -C _libei_builddir install

      - if: matrix.wayland == 'latest'
        name: build libportal
        run: |
            meson setup --prefix=/usr -Dbackend-gtk3=enabled -Ddocs=false libportal _libportal_builddir
            ninja -C _libportal_builddir install

      - name: Run build
        if: env.B_BUILD_TYPE != 'Release'
        run: |
          if [ "${{ env.B_BUILD_TYPE }}" = "Release" ]; then
            VERSION_DESC=release
          else
            VERSION_DESC=$(git -C input-leap log --pretty=format:'git-%cs-%h' -1)
          fi
          cmake -DCMAKE_BUILD_TYPE="${B_BUILD_TYPE}" -S input-leap -B build \
                -DCMAKE_CXX_FLAGS:STRING="-Wall -Wextra -Wno-unused-parameter" \
                -DCMAKE_CXX_FLAGS_DEBUG:STRING="-g -Werror" \
                -DINPUTLEAP_BUILD_LIBEI=${{ (matrix.wayland != 'none') && 'ON' || 'OFF' }} \
                -DINPUTLEAP_VERSION_DESC="$VERSION_DESC" \
                -DCMAKE_INSTALL_PREFIX=input-leap-${{ matrix.name }}
          cmake --build build --parallel --target install
        env:
            VERBOSE: 1
            CC: ${{ matrix.cc }}
            CXX: ${{ matrix.cxx }}

      - name: Run the tests
        if: env.B_BUILD_TYPE != 'Release'
        run: |
            ctest --test-dir build --verbose

      - name: Validate Release build and tests
        if: env.B_BUILD_TYPE == 'Release'
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -S input-leap -B release-validation -GNinja \
                -DINPUTLEAP_BUILD_TESTS=ON \
                -DINPUTLEAP_BUILD_LIBEI=${{ (matrix.wayland != 'none') && 'ON' || 'OFF' }} \
                -DINPUTLEAP_VERSION_DESC=release
          cmake --build release-validation --parallel
          xvfb-run -a ctest --test-dir release-validation --output-on-failure

      - name: Create Artifacts
        if: env.B_BUILD_TYPE != 'Release'
        run: tar -cf input-leap-${{matrix.name}}.tar.gz input-leap-${{matrix.name}}

      - name: Upload Artifacts
        if: env.B_BUILD_TYPE != 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: input-leap-${{matrix.name}}
          path: input-leap-${{matrix.name}}.tar.gz
          if-no-files-found: error

      - name: Build Debian package
        if: env.B_BUILD_TYPE == 'Release'
        run: |
          cd input-leap
          cp -r dist/debian debian
          if [ "${{ matrix.wayland }}" = "dist" ]; then
            sed -i -e 's/-DINPUTLEAP_BUILD_LIBEI=0/-DINPUTLEAP_BUILD_LIBEI=ON/g' debian/rules
          fi
          if [ "${{ env.B_BUILD_TYPE }}" = "Release" ]; then
            sed -i -e 's/INPUTLEAP_VERSION_DESC=git/INPUTLEAP_VERSION_DESC=release/g' debian/rules
          fi

          debuild -us -uc

      - name: Upload Artifacts
        if: env.B_BUILD_TYPE == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: input-leap-deb-${{matrix.name}}
          path: input-leap_*.deb
          if-no-files-found: error

  linux-rpm:
    if: ${{ inputs.include_legacy_platforms }}
    name: ${{ matrix.os }}
    runs-on: ubuntu-latest
    container: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["fedora:44", "opensuse/tumbleweed"]
        include:
          - installer: dnf install -y
            rpm_tag: fedora
          - os: opensuse/tumbleweed
            installer: zypper install -y
            rpm_tag: suse_version

    steps:
      - name: Install extra build dependencies
        run: ${{ matrix.installer }} git rpm-build ${{ startsWith(matrix.os, 'fedora:') && 'ninja-build' || 'ninja' }}

      # submodules require git to be installed
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: input-leap
          submodules: recursive
          set-safe-directory: ${{ github.workspace }}

      - name: Install dependencies
        run: |
          # Replace foo >= x with "foo >= x", print only what follows ^BuildRequires
          sed -n 's/\(\S\+ [<>=]\+ [0-9]\+.\?[0-9]\?\)/"\1"/;{s/^BuildRequires: //p}' input-leap/dist/rpm/input-leap.spec.in | xargs ${{ matrix.installer }}

      - name: prep tree
        run: |
          cmake -S input-leap -GNinja -B build -DINPUTLEAP_USE_EXTERNAL_GTEST=True
          ninja -C build package_source

      - name: create target directory
        run: mkdir rpms

      - name:  build SRPM package
        run: |
          rpmbuild -D "_sourcedir $PWD/build" -D "_srcrpmdir ${PWD}/rpms" -bs build/rpm/input-leap.spec

      - name: build RPM package
        run: |
          rpmbuild -D "_sourcedir $PWD/build" -D "_rpmdir $PWD/rpms" -bb build/rpm/input-leap.spec

      - name: Archive RPM package
        uses: actions/upload-artifact@v7
        with:
          name: input-leap-rpms-${{ matrix.rpm_tag }}
          path: |
            rpms/**/*.rpm

  mac-build:
    if: ${{ inputs.include_legacy_platforms }}
    name: ${{ matrix.name}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
       include:
         - name: macOS-Universal
           os: macos-14
           qt-version: 6.8
           qt-modules: ''
           min-macOS-version: 11
           arch: 'arm64;x86_64'
         - name: macOS-Apple_Silicon
           os: macos-14
           qt-version: 6.8
           qt-modules: ''
           min-macOS-version: 14
           arch: 'arm64'

    env:
      VERBOSE: 1
      TERM: xterm-256color
      OpenSSL_Install_Path: "/Users/runner/openssl"
      OpenSSL_Version: 3.2.0

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{matrix.qt-version}}
          modules: ${{matrix.qt-modules}}
          cache: true
          cache-key-prefix: macOS-${{matrix.os}}-Qt${{matrix.qt-version}}

      - name: Setup the image
        run: |
          brew install ninja

      - name: Cache OpenSSL Universal
        id: cache-openssl
        if: matrix.os == 'macos-14'
        uses: actions/cache@v6.1.0
        with:
          path: ${{env.OpenSSL_Install_Path}}
          key: macOS-${{matrix.os}}-ssl-${{matrix.arch}}-${{env.OpenSSL_Version}}

      - name: Build OpenSSL Universal
        if: ((steps.cache-openssl.outputs.cache-hit != 'true') && (matrix.os == 'macos-14'))
        run: |
          wget https://github.com/openssl/openssl/releases/download/openssl-${{env.OpenSSL_Version}}/openssl-${{env.OpenSSL_Version}}.tar.gz
          tar -xf openssl-${{env.OpenSSL_Version}}.tar.gz
          echo "#!/bin/bash
          if [[ \$* == *-arch\ x86_64* ]] && ! [[ \$* == *-arch\ arm64* ]]; then
            cc -arch arm64 \$@
          else
            cc \$@
          fi" >> /Users/runner/cc_override
          chmod a+x /Users/runner/cc_override
          cat /Users/runner/cc_override
          export MACOSX_DEPLOYMENT_TARGET=${{matrix.min-macOS-version}}
          export CC=/Users/runner/cc_override
          cd openssl-${{env.OpenSSL_Version}}
          ./configure no-asm darwin64-x86_64-cc --prefix=${{env.OpenSSL_Install_Path}}
          make
          make install

      - uses: actions/checkout@v7
        with:
          path: input-leap
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement input-leap/tools/requirements-test.txt

      - name: Setup the build
        run: |
          cmake -DCMAKE_BUILD_TYPE="${B_BUILD_TYPE}" -S input-leap -B build -G Ninja \
                -DOpenSSL_ROOT=${{env.OpenSSL_Install_Path}} \
                -DCMAKE_OSX_SYSROOT=$(xcode-select --print-path)/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=${{matrix.min-macOS-version}} \
                -DINPUTLEAP_VERSION_DESC=${{ (env.B_BUILD_TYPE == 'Release') && 'release' || 'git' }} \
                -DCMAKE_OSX_ARCHITECTURES="${{matrix.arch}}"

      - name: Run the build
        run: |
          cmake --build build --parallel
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v7
        if: env.B_BUILD_TYPE == 'Release'
        with:
          name: ${{ matrix.name }}-installer
          path: ./build/bundle/*.dmg
          if-no-files-found: error

      - name: Archive debug app
        if: env.B_BUILD_TYPE != 'Release'
        run: tar -czf InputLeap-${{matrix.name}}.tar.gz -C build/bundle InputLeap.app

      - uses: actions/upload-artifact@v7
        if: env.B_BUILD_TYPE != 'Release'
        with:
          name: ${{ matrix.name }}-debug
          path: ./InputLeap*.tar.gz
          if-no-files-found: error

  win-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
       include:
         - name: Windows Qt6
           os: windows-2022
           qt-version: 6.8.3
           qt-modules: ''

    steps:
      - uses: actions/checkout@v7
        with:
          path: input-leap
          submodules: recursive

      - name: Select Python interpreter
        shell: pwsh
        run: |
          $pythonExecutable = (python -c "import sys; print(sys.executable)").Trim()
          if (-not (Test-Path -LiteralPath $pythonExecutable)) { throw "Python interpreter not found: $pythonExecutable" }
          "INPUTLEAP_PYTHON_EXECUTABLE=$pythonExecutable" >> $env:GITHUB_ENV

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          & $env:INPUTLEAP_PYTHON_EXECUTABLE -m pip install --disable-pip-version-check --requirement input-leap/tools/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Python test dependency installation failed with exit code $LASTEXITCODE" }

      - name: Build pinned open-source DNS-SD runtime
        id: bonjour
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $PWD 'deps\mDNSResponder'
          New-Item -Force -ItemType Directory -Path (Split-Path -Parent $source) | Out-Null
          git init $source
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize pinned mDNSResponder source checkout' }
          git -C $source remote add origin https://github.com/apple-oss-distributions/mDNSResponder.git
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure pinned mDNSResponder source remote' }
          git -C $source fetch --depth 1 origin f783506af3836b39b83fc14115bc2728a49db4b2
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch pinned mDNSResponder source commit' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out pinned mDNSResponder source commit' }
          $sdk = Join-Path $PWD 'deps\DnsSdSdk'
          & .\input-leap\scripts\windows\build_mdns_responder.ps1 -SourceDirectory $source -OutputDirectory $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Pinned mDNSResponder source build failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $sdk 'Bin\x64\mDNSResponder.exe'))) {
            throw 'The source-built DNS-SD Windows service executable is missing'
          }
          "path=$sdk" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{matrix.qt-version}}
          modules: ${{matrix.qt-modules}}
          cache: true
          cache-key-prefix: windows-${{matrix.os}}-Qt${{matrix.qt-version}}

      - name: Configure build system
        run: |
          New-Item -Force -ItemType Directory -Path .\build | Out-Null

          cd build

          cmake -S ..\input-leap -G "$env:CMAKE_GEN" -A x64 -D CMAKE_BUILD_TYPE=$B_BUILD_TYPE `
            -DINPUTLEAP_VERSION_DESC=${{ (env.B_BUILD_TYPE == 'Release') && 'release' || 'git' }} `
            -DINPUTLEAP_PYTHON_EXECUTABLE="$env:INPUTLEAP_PYTHON_EXECUTABLE" `
            -DDNSSD_LIB="$env:BONJOUR_SDK_HOME\Lib\x64\dnssd.lib" -D CMAKE_INSTALL_PREFIX=input-leap-install
        env:
          VS_PATH: '%ProgramFiles%\Microsoft Visual Studio\2022'
          CMAKE_GEN: 'Visual Studio 17 2022'
          BONJOUR_SDK_HOME: ${{ steps.bonjour.outputs.path }}

      - name: Run build system
        run: |
          cmake --build build --config $env:B_BUILD_TYPE --target input-leap-tauri --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Tauri controller build failed with exit code $LASTEXITCODE" }
          cmake --build build --config $env:B_BUILD_TYPE --target install --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed with exit code $LASTEXITCODE" }
          $installDir = Resolve-Path .\build\input-leap-install

          # Record the exact Qt runtime payload selected by windeployqt. This
          # manifest is evidence for license review, not an automated license
          # determination; do not infer module terms from DLL names alone.
          $qtFiles = @(Get-ChildItem -LiteralPath $installDir -Recurse -File | Where-Object {
            $_.Name -match '^Qt6.*\.dll$' -or
            ($_.Extension -ieq '.dll' -and $_.DirectoryName -match '[\\/]plugins([\\/]|$)')
          } | Sort-Object { $_.FullName.Substring($installDir.Path.Length).TrimStart([char[]]@('\', '/')) })
          if ($qtFiles.Count -eq 0) { throw 'No deployed Qt libraries or plugins found in the Windows install tree' }
          $qtManifest = foreach ($file in $qtFiles) {
            $relativePath = $file.FullName.Substring($installDir.Path.Length).TrimStart([char[]]@('\', '/')).Replace('\', '/')
            $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($file.FullName)
            [pscustomobject]@{
              path = $relativePath
              length = $file.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
              productVersion = $versionInfo.ProductVersion
              fileVersion = $versionInfo.FileVersion
            }
          }
          $qtManifestPath = Join-Path $installDir 'licenses\Qt\DEPLOYED-PAYLOAD.json'
          New-Item -ItemType Directory -Path (Split-Path -Parent $qtManifestPath) -Force | Out-Null
          $qtManifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $qtManifestPath -Encoding utf8
          $qtSbomRoot = Join-Path $env:QT_ROOT_DIR 'sbom'
          $qtSboms = @()
          if (Test-Path -LiteralPath $qtSbomRoot -PathType Container) {
            $candidateSboms = @(Get-ChildItem -LiteralPath $qtSbomRoot -Recurse -File | Where-Object {
              $_.Extension -in @('.json', '.spdx')
            })
            foreach ($candidate in $candidateSboms) {
              $headerLines = @()
              $isSpdxTagValue = $false
              $isJsonDocument = $false
              if ($candidate.Extension -ieq '.json') {
                try {
                  $candidateJson = Get-Content -Raw -LiteralPath $candidate.FullName -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
                  $isJsonDocument = $candidateJson.spdxVersion -match '^SPDX-2\.' -or
                    $candidateJson.bomFormat -eq 'CycloneDX'
                } catch {
                  if ($candidate.Name -match 'qt-framework|sbom|spdx') {
                    throw "Qt SBOM candidate is invalid JSON: $($candidate.FullName): $($_.Exception.Message)"
                  }
                }
              } else {
                $headerLines = @(Get-Content -LiteralPath $candidate.FullName -TotalCount 12 -ErrorAction Stop)
                $header = $headerLines -join "`n"
                $isSpdxTagValue = $header -match '(?m)^SPDXVersion:\s*SPDX-2\.[0-9]+\s*$'
              }
              if ($isSpdxTagValue -or $isJsonDocument) {
                $qtSboms += $candidate
              } elseif ($candidate.Name -match 'qt-framework|sbom|spdx') {
                $diagnosticHeader = if ($headerLines.Count -gt 0) { ($headerLines | Select-Object -First 5) -join ' | ' } else { 'JSON parsed but had no recognized SPDX/CycloneDX version field' }
                throw "Qt SBOM candidate does not have a recognized SPDX/CycloneDX header: $($candidate.FullName). $diagnosticHeader"
              }
            }
          }
          if ($qtSboms.Count -eq 0) {
            Write-Warning "Qt SDK did not provide an SPDX/SBOM file under '$qtSbomRoot'; upstream component license provenance remains unresolved."
          } else {
            $qtSbomDir = Join-Path $installDir 'licenses\Qt\sbom'
            New-Item -ItemType Directory -Path $qtSbomDir -Force | Out-Null
            foreach ($sbom in $qtSboms) {
              $relativeSbomPath = $sbom.FullName.Substring($qtSbomRoot.Length).TrimStart([char[]]@('\', '/'))
              $destination = Join-Path $qtSbomDir $relativeSbomPath
              New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
              Copy-Item -LiteralPath $sbom.FullName -Destination $destination -Force
              if ($sbom.Extension -ieq '.json') {
                $json = Get-Content -Raw -LiteralPath $destination | ConvertFrom-Json
                if ($json.spdxVersion -notmatch '^SPDX-2\.' -and $json.bomFormat -ne 'CycloneDX') {
                  throw "Qt SBOM JSON is not recognized as SPDX or CycloneDX: $($sbom.FullName)"
                }
              }
            }
            Write-Host "Preserved $($qtSboms.Count) Qt SDK SBOM file(s) from '$qtSbomRoot'."
          }
          $env:QT_QPA_PLATFORM = "windows"
          ctest --test-dir build -C $env:B_BUILD_TYPE --output-on-failure

      - name: Create Archive
        run: Compress-Archive -Path build\input-leap-install\* -DestinationPath ${{ env.B_BUILD_TYPE }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ env.B_BUILD_TYPE }}
          path: ${{ env.B_BUILD_TYPE }}.zip
          if-no-files-found: warn

      - name: Build the Installer
        if: env.B_BUILD_TYPE == 'Release'
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp .\build\installer-inno\input-leap.iss

      - name: Prepare complete Windows installer SBOM input
        if: env.B_BUILD_TYPE == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Resolve-Path .\build\input-leap-install
          $sbomInput = Join-Path $PWD 'build\windows-installer-sbom-input'
          New-Item -ItemType Directory -Path $sbomInput -Force | Out-Null
          Copy-Item -Path (Join-Path $installDir '*') -Destination $sbomInput -Recurse -Force
          $legalFiles = @(
            @{ Source = '.\input-leap\LICENSE'; Destination = 'LICENSE.txt' },
            @{ Source = '.\input-leap\res\License.rtf'; Destination = 'License.rtf' },
            @{ Source = '.\input-leap\THIRD_PARTY_NOTICES.md'; Destination = 'THIRD_PARTY_NOTICES.md' }
          )
          foreach ($file in $legalFiles) {
            if (-not (Test-Path -LiteralPath $file.Source -PathType Leaf)) { throw "Installer legal file is missing: $($file.Source)" }
            Copy-Item -LiteralPath $file.Source -Destination (Join-Path $sbomInput $file.Destination) -Force
          }

      - name: Generate Windows package SBOM
        if: env.B_BUILD_TYPE == 'Release'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_FILE_METADATA_SELECTION: all
        with:
          path: .\build\windows-installer-sbom-input
          format: cyclonedx-json
          output-file: .\build\installer-inno\bin\input-leap-windows-x64.cdx.json
          artifact-name: input-leap-windows-x64-sbom-${{ matrix.name }}
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Rust workspace dependency SBOM
        if: env.B_BUILD_TYPE == 'Release'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .\input-leap\rust
          format: cyclonedx-json
          output-file: .\build\installer-inno\bin\input-leap-rust-workspace.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Tauri dependency SBOM
        if: env.B_BUILD_TYPE == 'Release'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .\input-leap\rust\apps\input-leap\src-tauri
          format: cyclonedx-json
          output-file: .\build\installer-inno\bin\input-leap-tauri-dependencies.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate agent dependency SBOM
        if: env.B_BUILD_TYPE == 'Release'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .\input-leap\rust\bins\input-leap-agent
          format: cyclonedx-json
          output-file: .\build\installer-inno\bin\input-leap-agent-dependencies.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate server dependency SBOM
        if: env.B_BUILD_TYPE == 'Release'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .\input-leap\rust\bins\input-leap-server
          format: cyclonedx-json
          output-file: .\build\installer-inno\bin\input-leap-server-dependencies.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Enrich Rust SBOMs with Cargo license expressions
        if: env.B_BUILD_TYPE == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sbomDir = Join-Path $PWD 'build\installer-inno\bin'
          $allRustManifests = @(
            (Join-Path $PWD 'input-leap\rust\Cargo.toml'),
            (Join-Path $PWD 'input-leap\rust\apps\input-leap\src-tauri\Cargo.toml'),
            (Join-Path $PWD 'input-leap\rust\bins\input-leap-agent\Cargo.toml'),
            (Join-Path $PWD 'input-leap\rust\bins\input-leap-server\Cargo.toml')
          )
          $sbomInputs = @(
            @{ Sbom = 'input-leap-rust-workspace.cdx.json'; Manifests = $allRustManifests },
            @{ Sbom = 'input-leap-tauri-dependencies.cdx.json'; Manifests = @($allRustManifests[1]) },
            @{ Sbom = 'input-leap-agent-dependencies.cdx.json'; Manifests = @($allRustManifests[2]) },
            @{ Sbom = 'input-leap-server-dependencies.cdx.json'; Manifests = @($allRustManifests[3]) }
          )
          foreach ($item in $sbomInputs) {
            & .\input-leap\scripts\windows\enrich_sbom_licenses.ps1 `
              -SbomPath (Join-Path $sbomDir $item.Sbom) `
              -ManifestPaths $item.Manifests
            if ($LASTEXITCODE -ne 0) { throw "SBOM license enrichment failed for $($item.Sbom)" }
          }

      - name: Validate dependency SBOM coverage
        if: env.B_BUILD_TYPE == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bomDir = Resolve-Path .\build\installer-inno\bin
          $bomNames = @(
            'input-leap-windows-x64.cdx.json',
            'input-leap-rust-workspace.cdx.json',
            'input-leap-tauri-dependencies.cdx.json',
            'input-leap-agent-dependencies.cdx.json',
            'input-leap-server-dependencies.cdx.json'
          )
          foreach ($name in $bomNames) {
            $path = Join-Path $bomDir $name
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing dependency SBOM: $name" }
            $bom = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
            if ($bom.bomFormat -ne 'CycloneDX' -or $bom.specVersion -notmatch '^1\.[4-7]$') { throw "Invalid CycloneDX SBOM: $name" }
            if (-not $bom.metadata.timestamp -or -not $bom.metadata.tools) { throw "SBOM metadata is incomplete: $name" }
            $components = @($bom.components)
            if ($components.Count -lt 10) { throw "SBOM has implausibly few components: $name ($($components.Count))" }
            $purls = @($components | Where-Object { $_.purl }).Count
            if ($name -eq 'input-leap-windows-x64.cdx.json') {
              $componentNames = @($components | ForEach-Object { ($_.name -replace '\\', '/').Split('/')[-1] })
              foreach ($required in @('dnssd.dll', 'mDNSResponder.exe', 'input-leap.exe', 'input-leapc.exe', 'input-leaps.exe', 'LICENSE.txt', 'License.rtf', 'THIRD_PARTY_NOTICES.md', 'GPL-2.0.txt', 'DEPLOYED-PAYLOAD.json', 'SOURCE.txt', 'LICENSE', 'LICENSE-APACHE-2.0.txt', 'SHA256SUMS.txt')) {
                if ($componentNames -notcontains $required) { throw "Windows installer SBOM does not inventory required runtime/provenance/legal file: $required" }
              }
              $qtSbomDir = Join-Path $PWD 'build\windows-installer-sbom-input\licenses\Qt\sbom'
              if (Test-Path -LiteralPath $qtSbomDir -PathType Container) {
                $qtSbomFiles = @(Get-ChildItem -LiteralPath $qtSbomDir -Recurse -File)
                if ($qtSbomFiles.Count -eq 0) { throw 'Qt SBOM directory exists but contains no files' }
                foreach ($qtSbomFile in $qtSbomFiles) {
                  $header = Get-Content -LiteralPath $qtSbomFile.FullName -TotalCount 12 | Out-String
                  if ($header -match '(?m)^SPDXVersion:\s*SPDX-2\.[0-9]+\s*$') { continue }
                  $qtSbomJson = Get-Content -Raw -LiteralPath $qtSbomFile.FullName | ConvertFrom-Json
                  if ($qtSbomJson.spdxVersion -notmatch '^SPDX-2\.' -and $qtSbomJson.bomFormat -ne 'CycloneDX') {
                    throw "Packaged Qt SBOM JSON is not recognized: $($qtSbomFile.Name)"
                  }
                }
              }
              $qtPayloadPath = Join-Path $PWD 'build\windows-installer-sbom-input\licenses\Qt\DEPLOYED-PAYLOAD.json'
              $qtPayload = @(Get-Content -Raw -LiteralPath $qtPayloadPath | ConvertFrom-Json)
              if ($qtPayload.Count -eq 0) { throw 'Qt deployed-payload manifest is empty' }
              $fileComponents = @($components | Where-Object { $_.type -eq 'file' })
              foreach ($entry in $qtPayload) {
                if (-not $entry.path -or $entry.sha256 -notmatch '^[0-9a-f]{64}$' -or -not $entry.productVersion) {
                  throw "Qt deployed-payload entry is incomplete: $($entry.path)"
                }
                $payloadLeaf = Split-Path -Leaf $entry.path
                $sbomEntry = @($fileComponents | Where-Object { (Split-Path -Leaf ($_.name -replace '/', '\')) -ieq $payloadLeaf })
                if ($sbomEntry.Count -eq 0) {
                  throw "Windows package SBOM omits deployed Qt payload file: $($entry.path)"
                }
                $matchingHash = @($sbomEntry | Where-Object {
                  @($_.hashes | Where-Object { $_.alg -eq 'SHA-256' -and $_.content -and $_.content.ToLowerInvariant() -eq $entry.sha256 }).Count -gt 0
                })
                if ($matchingHash.Count -eq 0) {
                  throw "Windows package SBOM does not contain the manifest SHA-256 for deployed Qt file: $($entry.path)"
                }
              }
              $missingHashes = @($fileComponents | Where-Object { @($_.hashes | Where-Object { $_.alg -eq 'SHA-256' -and $_.content }).Count -eq 0 })
              if ($missingHashes.Count -gt 0) { throw "Windows package SBOM has $($missingHashes.Count) file components without SHA-256 hashes" }
              if (-not $bom.metadata.component.name) { throw 'Windows package SBOM has no root package component' }
              Write-Host "$name components=$($components.Count) file_components=$($fileComponents.Count) sha256=$($fileComponents.Count) qt_payload_files=$($qtPayload.Count) required_payload_files=15"
            } else {
              if ($purls -lt 10) { throw "SBOM has insufficient package identifiers: $name ($purls)" }
              $cargoComponents = @($components | Where-Object { $_.purl -like 'pkg:cargo/*' })
              $missingCargoLicenses = @($cargoComponents | Where-Object { -not $_.licenses -or @($_.licenses).Count -eq 0 })
              if ($cargoComponents.Count -eq 0 -or $missingCargoLicenses.Count -gt 0) {
                throw "SBOM has Cargo components without license expressions: $name ($($missingCargoLicenses.Count) missing)"
              }
              $edges = @($bom.dependencies | Where-Object { @($_.dependsOn).Count -gt 0 }).Count
              if ($edges -lt 5) { throw "SBOM has insufficient dependency relationships: $name ($edges)" }
              Write-Host "$name components=$($components.Count) purls=$purls licensed_cargo_components=$($cargoComponents.Count) dependency_nodes=$(@($bom.dependencies).Count) edges=$edges"
            }
          }

      - name: Generate installer SHA-256 manifest
        if: env.B_BUILD_TYPE == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = Resolve-Path .\build\installer-inno\bin
          $manifestPath = Join-Path $outputDir 'SHA256SUMS.txt'
          $entries = Get-ChildItem -LiteralPath $outputDir -File -Filter 'InputLeapSetup-*.exe' |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name }
          if (-not $entries) { throw 'No installer found for SHA-256 manifest' }
          Set-Content -LiteralPath $manifestPath -Value $entries -Encoding ascii

      - name: Download previous installer for upgrade and rollback validation
        if: env.B_BUILD_TYPE == 'Release' && inputs.upgrade_from_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTLEAP_UPGRADE_FROM_RUN_ID: ${{ inputs.upgrade_from_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUTLEAP_UPGRADE_FROM_RUN_ID -notmatch '^\d+$') { throw 'upgrade_from_run_id must be a numeric GitHub Actions run ID' }
          $sourceRunJson = gh run view $env:INPUTLEAP_UPGRADE_FROM_RUN_ID --repo $env:GITHUB_REPOSITORY --json status,conclusion,headBranch,headSha,event,workflowName
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the previous workflow run' }
          $sourceRun = $sourceRunJson | ConvertFrom-Json
          if ($sourceRun.status -ne 'completed' -or $sourceRun.conclusion -ne 'success' -or $sourceRun.headBranch -ne 'master' -or $sourceRun.workflowName -ne 'Build tests') {
            throw 'Previous installer run must be a successful Build tests run from the fork master branch'
          }
          if ($sourceRun.event -notin @('workflow_dispatch', 'release')) { throw 'Previous installer must come from a Release or workflow_dispatch run' }
          $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/$($sourceRun.headSha)...$env:GITHUB_SHA" --jq .status
          if ($LASTEXITCODE -ne 0 -or $comparison -notin @('ahead', 'identical')) { throw 'Previous installer commit is not an ancestor of the commit being validated' }
          $previousDir = Join-Path $PWD 'build\previous-installer'
          New-Item -ItemType Directory -Force -Path $previousDir | Out-Null
          gh run download $env:INPUTLEAP_UPGRADE_FROM_RUN_ID --repo $env:GITHUB_REPOSITORY --dir $previousDir --name 'windows-installer-Windows Qt6'
          if ($LASTEXITCODE -ne 0) { throw "Failed to download Windows installer artifact from run $env:INPUTLEAP_UPGRADE_FROM_RUN_ID" }
          $previousInstaller = Get-ChildItem -LiteralPath $previousDir -File -Filter 'InputLeapSetup-*.exe'
          if ($previousInstaller.Count -ne 1) { throw "Expected exactly one previous installer, found $($previousInstaller.Count)" }
          $manifest = Join-Path $previousDir 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'Previous installer artifact has no SHA256SUMS.txt' }
          $match = Select-String -LiteralPath $manifest -Pattern ('^([0-9a-fA-F]{64})\s+' + [regex]::Escape($previousInstaller[0].Name) + '$')
          if ($null -eq $match) { throw 'Previous installer is not covered by SHA256SUMS.txt' }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $previousInstaller[0].FullName).Hash
          if ($actualHash -ne $match.Matches[0].Groups[1].Value) { throw 'Previous installer SHA-256 does not match its manifest' }
          "INPUTLEAP_PREVIOUS_INSTALLER=$($previousInstaller[0].FullName)" >> $env:GITHUB_ENV

      - name: Smoke-test Windows installer lifecycle
        if: env.B_BUILD_TYPE == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem .\build\installer-inno\bin\InputLeapSetup-*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer artifact was not created' }

          $installDir = Join-Path $env:ProgramFiles 'InputLeap'
          $stateDir = Join-Path $env:ProgramData 'InputLeap'
          $sentinel = Join-Path $stateDir 'installer-smoke-test-preserve.txt'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          Set-Content -LiteralPath $sentinel -Value 'preserve shared state on uninstall'
          $silentArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-')
          if (Get-Service -Name 'Bonjour Service' -ErrorAction SilentlyContinue) {
            throw 'Windows runner already has a DNS-SD service; managed-service lifecycle test requires a clean baseline'
          }

          function Assert-InstalledPackage([string]$expectedRuntimeHash = '', [bool]$requireMdns = $true, [bool]$requireCurrentLegalPayload = $true) {
            foreach ($file in @('input-leap-tauri.exe', 'input-leap.exe', 'input-leaps.exe', 'input-leapc.exe', 'input-leapd.exe')) {
              if (-not (Test-Path (Join-Path $installDir $file))) { throw "Required installed file missing: $file" }
            }
            if ($requireCurrentLegalPayload) {
              foreach ($file in @('LICENSE.txt', 'License.rtf', 'THIRD_PARTY_NOTICES.md', 'licenses\Qt\GPL-2.0.txt', 'licenses\Qt\SOURCE.txt', 'licenses\Qt\DEPLOYED-PAYLOAD.json')) {
                if (-not (Test-Path (Join-Path $installDir $file))) { throw "Required installed legal file missing: $file" }
              }
              $qtPayload = @(Get-Content -Raw -LiteralPath (Join-Path $installDir 'licenses\Qt\DEPLOYED-PAYLOAD.json') | ConvertFrom-Json)
              if ($qtPayload.Count -eq 0) { throw 'Installed Qt deployed-payload manifest is empty' }
              foreach ($entry in $qtPayload) {
                $qtPath = Join-Path $installDir $entry.path.Replace('/', '\')
                if (-not (Test-Path -LiteralPath $qtPath -PathType Leaf)) { throw "Installed Qt payload file missing: $($entry.path)" }
                $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $qtPath).Hash.ToLowerInvariant()
                if ($actualHash -ne $entry.sha256) { throw "Installed Qt payload hash mismatch: $($entry.path)" }
              }
            }
            if ($requireMdns) {
              foreach ($file in @('dnssd.dll', 'mDNSResponder.exe', 'licenses\mDNSResponder\LICENSE', 'licenses\mDNSResponder\LICENSE-APACHE-2.0.txt', 'licenses\mDNSResponder\SOURCE.txt', 'licenses\mDNSResponder\SHA256SUMS.txt')) {
                if (-not (Test-Path (Join-Path $installDir $file))) { throw "Required DNS-SD runtime/provenance file missing: $file" }
              }
            }
            foreach ($forbidden in @('Bonjour.msi', 'Bonjour64.msi')) {
              if (Get-ChildItem -LiteralPath $installDir -Recurse -File -Filter $forbidden -ErrorAction SilentlyContinue) {
                throw "Installer unexpectedly bundles a proprietary Bonjour installer: $forbidden"
              }
            }
            if ($requireCurrentLegalPayload) {
              $notices = Get-Content -Raw -LiteralPath (Join-Path $installDir 'THIRD_PARTY_NOTICES.md')
              $qtLicense = Get-Content -Raw -LiteralPath (Join-Path $installDir 'licenses\Qt\GPL-2.0.txt')
              if ($qtLicense -notmatch '^GNU GENERAL PUBLIC LICENSE\s+Version 2, June 1991') {
                throw 'Installed Qt license file is not the complete GPL-2.0 text'
              }
              if ($qtLicense -match 'OpenSSL is allowed') {
                throw 'InputLeap OpenSSL exception was incorrectly included in Qt license text'
              }
              if ($notices -notmatch 'licenses/Qt/GPL-2\.0\.txt' -or $notices -notmatch 'GPL-2\.0-only') {
                throw 'Installed third-party notices do not identify the selected Qt GPL-2.0-only terms'
              }
              if ($notices -notmatch 'distribution gate remains closed until') {
                throw 'Installed third-party notices do not preserve the unresolved Qt distribution gate'
              }
              if ($requireMdns -and $notices -notmatch 'f783506af3836b39b83fc14115bc2728a49db4b2') {
                throw 'Installed third-party notices do not identify the bundled DNS-SD source revision'
              }
            }
            $service = Get-Service -Name 'InputLeap' -ErrorAction SilentlyContinue
            if ($null -eq $service) { throw 'InputLeap service missing after install' }
            if ($service.Status -ne 'Running') { throw "InputLeap service did not start after install: $($service.Status)" }
            if ($requireMdns) {
              $mdnsService = $null
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                $mdnsService = Get-Service -Name 'Bonjour Service' -ErrorAction SilentlyContinue
                if ($mdnsService -and $mdnsService.Status -eq 'Running') { break }
                Start-Sleep -Seconds 1
              }
              if ($null -eq $mdnsService -or $mdnsService.Status -ne 'Running') { throw 'DNS-SD service is missing or stopped after install' }
            }
            if ($expectedRuntimeHash) {
              $installedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $installDir 'input-leapd.exe')).Hash
              if ($installedHash -ne $expectedRuntimeHash) { throw 'Installed daemon hash does not match the expected package' }
            }
          }

          function Install-Package([string]$packagePath, [string]$label, [bool]$requireMdns = $true, [bool]$requireCurrentLegalPayload = $true) {
            $result = Start-Process -FilePath $packagePath -ArgumentList $silentArgs -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "$label installer failed with exit code $($result.ExitCode)" }
            Assert-InstalledPackage '' $requireMdns $requireCurrentLegalPayload
          }

          function Uninstall-Package([bool]$expectManagedMdnsRemoval = $true) {
            $uninstaller = Join-Path $installDir 'unins000.exe'
            if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing after install' }
            $remove = Start-Process -FilePath $uninstaller -ArgumentList $silentArgs -Wait -PassThru
            if ($remove.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($remove.ExitCode)" }
            if (Test-Path (Join-Path $installDir 'input-leap-tauri.exe')) { throw 'Tauri application files remain after uninstall' }
            for ($attempt = 0; $attempt -lt 30 -and (Get-Service -Name 'InputLeap' -ErrorAction SilentlyContinue); $attempt++) { Start-Sleep -Seconds 1 }
            if (Get-Service -Name 'InputLeap' -ErrorAction SilentlyContinue) { throw 'InputLeap service remains after uninstall' }
            $remainingMdns = Get-Service -Name 'Bonjour Service' -ErrorAction SilentlyContinue
            if ($expectManagedMdnsRemoval) {
              for ($attempt = 0; $attempt -lt 30 -and $remainingMdns; $attempt++) {
                Start-Sleep -Seconds 1
                $remainingMdns = Get-Service -Name 'Bonjour Service' -ErrorAction SilentlyContinue
              }
            }
            if ($expectManagedMdnsRemoval -and $remainingMdns) { throw 'InputLeap-owned DNS-SD service remains after uninstall' }
            if (-not $expectManagedMdnsRemoval -and $null -eq $remainingMdns) { throw 'Uninstall removed the pre-existing DNS-SD service' }
            if (Get-NetFirewallRule -DisplayName 'InputLeap Listener' -ErrorAction SilentlyContinue) { throw 'InputLeap listener firewall rule remains after uninstall' }
            if (Get-NetFirewallRule -DisplayName 'InputLeap File Transfer' -ErrorAction SilentlyContinue) { throw 'InputLeap file-transfer firewall rule remains after uninstall' }
          }

          if ($env:INPUTLEAP_PREVIOUS_INSTALLER) {
            $previousPath = $env:INPUTLEAP_PREVIOUS_INSTALLER
            Install-Package $previousPath 'Previous' $false $false
            $previousInstalledHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $installDir 'input-leapd.exe')).Hash

            Install-Package $installer.FullName 'Current upgrade'
            $currentInstalledHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $installDir 'input-leapd.exe')).Hash
            if ($currentInstalledHash -eq $previousInstalledHash) { throw 'Upgrade did not replace the previous runtime binary' }

            # Exercise repair behavior instead of merely invoking the installer twice.
            $repairTarget = Join-Path $installDir 'input-leapc.exe'
            Remove-Item -LiteralPath $repairTarget -Force
            if (Test-Path -LiteralPath $repairTarget) { throw 'Could not remove the repair test target' }
            Install-Package $installer.FullName 'Current repair/reinstall'
            Assert-InstalledPackage $currentInstalledHash
            if (-not (Test-Path -LiteralPath $repairTarget -PathType Leaf)) { throw 'Repair did not restore the missing client executable' }
            Uninstall-Package

            Install-Package $previousPath 'Rollback' $false $false
            Assert-InstalledPackage $previousInstalledHash $false $false
            Uninstall-Package
          } else {
            foreach ($attempt in 1..2) {
              Install-Package $installer.FullName "Installer attempt $attempt"
            }
            Uninstall-Package
          }

          # Prove that an existing Bonjour-compatible service is neither claimed nor removed.
          $externalMdnsExe = Join-Path $env:GITHUB_WORKSPACE 'deps\DnsSdSdk\Bin\x64\mDNSResponder.exe'
          if (-not (Test-Path -LiteralPath $externalMdnsExe)) { throw 'Source-built mDNSResponder executable missing for ownership test' }
          & $externalMdnsExe -install
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare pre-existing DNS-SD service for ownership test: $LASTEXITCODE" }
          try {
            Install-Package $installer.FullName 'Install with pre-existing DNS-SD service'
            Uninstall-Package $false
            $preservedMdns = Get-Service -Name 'Bonjour Service' -ErrorAction SilentlyContinue
            if ($null -eq $preservedMdns -or $preservedMdns.Status -ne 'Running') { throw 'Pre-existing DNS-SD service was not preserved and running after uninstall' }
          } finally {
            if (Get-Service -Name 'Bonjour Service' -ErrorAction SilentlyContinue) {
              & $externalMdnsExe -remove
              if ($LASTEXITCODE -ne 0) { throw "Could not clean up pre-existing DNS-SD test service: $LASTEXITCODE" }
            }
          }

          if (-not (Test-Path $sentinel)) { throw 'Uninstall removed shared ProgramData; user state must be preserved' }
          Remove-Item -LiteralPath $sentinel -Force

      - uses: actions/upload-artifact@v7
        if: env.B_BUILD_TYPE == 'Release'
        with:
          name: windows-installer-${{ matrix.name }}
          path: .\build\installer-inno\bin
          if-no-files-found: error

  windows-clean-installer-smoke:
    name: Windows clean-runner installer smoke
    if: ${{ (inputs.build_release || github.event_name == 'release') && needs.win-build.result == 'success' && needs.windows-qt-source.result == 'success' }}
    needs: [win-build, windows-qt-source]
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: windows-installer-Windows Qt6
          path: ${{ runner.temp }}\inputleap-installer

      - name: Install and uninstall package on a fresh Windows runner
        shell: pwsh
        run: .\scripts\windows\smoke_installer_clean.ps1 -ArtifactDirectory "$env:RUNNER_TEMP\inputleap-installer"

  windows-qt-source:
    name: Verify and publish Qt 6.8.3 corresponding source artifact
    if: ${{ inputs.build_release || github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify official Qt source archive
        shell: bash
        run: |
          set -euo pipefail
          archive='qt-everywhere-src-6.8.3.tar.xz'
          expected='cdd3a69967208276bb01af7ace7dba0ba53e679f886a4cbe624225c60fb73f2c'
          source_dir="$RUNNER_TEMP/qt-source-6.8.3"
          mkdir -p "$source_dir"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://download.qt.io/archive/qt/6.8/6.8.3/single/$archive" \
            --output "$source_dir/$archive"
          printf '%s  %s\n' "$expected" "$source_dir/$archive" | sha256sum --check --status
          printf '%s  %s\n' "$expected" "$archive" > "$source_dir/Qt-SOURCE-SHA256SUMS.txt"
          printf 'Qt 6.8.3 upstream source archive\nURL: https://download.qt.io/archive/qt/6.8/6.8.3/single/%s\nSHA-256: %s\nLicense selection in InputLeap package: GPL-2.0-only, subject to deployed component audit.\n' \
            "$archive" "$expected" > "$source_dir/Qt-SOURCE.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: qt-source-6.8.3
          path: ${{ runner.temp }}/qt-source-6.8.3
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

  freebsd-build:
    if: ${{ inputs.include_legacy_platforms }}
    name: freebsd-14-3
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build on FreeBSD 14.3
      id: test
      uses: vmactions/freebsd-vm@v1
      with:
        release: 14.3
        usesh: true
        prepare: |
          pkg install -y \
              cmake-core \
              pkgconf \
              git \
              avahi-libdns \
              libsm \
              libxinerama \
              libxrandr \
              libxtst \
              libxkbcommon \
              glib \
              ninja \
              qt6-base \
              qt6-tools \
              qt6-declarative

        run: |
          git config --global --add safe.directory /home/runner/work/input-leap/input-leap
          git submodule update --init --recursive
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DINPUTLEAP_BUILD_INSTALLER=OFF ..
          cmake --build . --parallel

  flatpak:
    if: ${{ inputs.include_legacy_platforms }}
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      # submodules require git to be installed
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - run: git config --global protocol.file.allow always

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        name: "Build"
        with:
          bundle: input-leap.flatpak
          manifest-path: dist/flatpak/io.github.input_leap.input-leap.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        if: env.B_BUILD_TYPE == 'Release'
        with:
          name: input-leap-flatpak-x86_64
          path: input-leap.flatpak
          if-no-files-found: error
