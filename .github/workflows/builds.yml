name: Build tests

on:
  release:

  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release binaries'
        required: false
        type: boolean
      include_legacy_platforms:
        description: 'Also build Linux, macOS, FreeBSD and Flatpak (outside the Windows release scope)'
        required: false
        type: boolean

# Set the build type here
env:
  B_BUILD_TYPE: ${{ (inputs.build_release || github.event_name == 'release') && 'Release' || 'Debug' }}
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux-build:
    if: ${{ inputs.include_legacy_platforms }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
       include:

         - name: ubuntu-22-04-clang
           os: "ubuntu:22.04"
           cc: "clang"
           cxx: "clang++"
           wayland: none
         - name: ubuntu-22-04
           os: "ubuntu:22.04"
           cc: "gcc"
           cxx: "g++"
           wayland: none
         - name: ubuntu-24-04
           os: "ubuntu:24.04"
           cc: "gcc"
           cxx: "g++"
           wayland: dist

         - name: debian-12
           os: "debian:bookworm"
           cc: "gcc"
           cxx: "g++"
           wayland: none
         - name: debian-12-latest-libei
           os: "debian:bookworm"
           cc: "gcc"
           cxx: "g++"
           wayland: latest
    steps:


      - name: Update and install packages
        run: |
          apt-get update -y
          apt-get dist-upgrade -y
          apt-get install -y \
                  cmake \
                  g++ \
                  clang \
                  git \
                  libavahi-compat-libdnssd-dev \
                  libgtest-dev \
                  libgl-dev \
                  libgmock-dev \
                  libice-dev \
                  libpng-dev \
                  libsm-dev \
                  libssl-dev \
                  libxinerama-dev \
                  libxrandr-dev \
                  libxtst-dev \
                  libxkbcommon-dev \
                  libglib2.0-dev \
                  python3-cryptography \
                  ninja-build \
                  python-is-python3

      - if: env.B_BUILD_TYPE == 'Release'
        name: Install release installer build packages
        run: |
          apt-get install -y \
                  debhelper \
                  devscripts \
                  xvfb

      - name: Install Qt6 packages
        run: |
          apt-get install -y \
                  qt6-base-dev \
                  qt6-l10n-tools \
                  qt6-tools-dev-tools \
                  qt6-tools-dev

      - if: matrix.wayland == 'latest'
        name: Install libei and libportal pre-reqs
        run: |
          apt-get install -y \
                  ca-certificates \
                  dbus \
                  gettext \
                  git \
                  libgirepository1.0-dev \
                  libglib2.0 \
                  libgtk-3-dev \
                  libprotobuf-c-dev \
                  libsystemd-dev \
                  meson \
                  protobuf-c-compiler \
                  protobuf-compiler \
                  python3-attr \
                  python3-dbusmock \
                  python3-jinja2 \
                  python3-pip \
                  python3-pytest \
                  python3-jinja2 \
                  valac

      - if: matrix.wayland == 'dist'
        name: Install libei and libportal distribution packages
        run: |
          apt-get install -y \
                libei-dev \
                libportal-dev

      # Code checkout steps
      - name: Checkout input-leap
        uses: actions/checkout@v7
        with:
          path: input-leap
          submodules: recursive
          set-safe-directory: ${{ github.workspace }}

      - if: matrix.wayland == 'latest'
        name: Get libei v1.3.0 from freedesktop
        # Manual checkout of libinput/libei ref 1.3.0 from https://gitlab.freedesktop.org
        # because actions/checkout does not support gitlab
        run: |
          git clone --depth=1 --branch="$ref" --recurse-submodules -- \
            "https://gitlab.freedesktop.org/libinput/libei" libei
        env:
          ref: 1.3.0

      - if: matrix.wayland == 'latest'
        name: Get libportal from upstream
        uses: actions/checkout@v7
        with:
          repository: flatpak/libportal
          # Debian 12 provides GLib 2.74; libportal main currently requires 2.80.
          ref: 0.9.1
          path: libportal

      - if: matrix.wayland == 'latest'
        name: build libei from git tag
        run: |
            meson setup -Dprefix=/usr -Dtests=disabled -Dliboeffis=disabled -Ddocumentation=[] libei _libei_builddir
            ninja -C _libei_builddir install

      - if: matrix.wayland == 'latest'
        name: build libportal
        run: |
            meson setup --prefix=/usr -Dbackend-gtk3=enabled -Ddocs=false libportal _libportal_builddir
            ninja -C _libportal_builddir install

      - name: Run build
        if: env.B_BUILD_TYPE != 'Release'
        run: |
          if [ "${{ env.B_BUILD_TYPE }}" = "Release" ]; then
            VERSION_DESC=release
          else
            VERSION_DESC=$(git -C input-leap log --pretty=format:'git-%cs-%h' -1)
          fi
          cmake -DCMAKE_BUILD_TYPE="${B_BUILD_TYPE}" -S input-leap -B build \
                -DCMAKE_CXX_FLAGS:STRING="-Wall -Wextra -Wno-unused-parameter" \
                -DCMAKE_CXX_FLAGS_DEBUG:STRING="-g -Werror" \
                -DINPUTLEAP_BUILD_LIBEI=${{ (matrix.wayland != 'none') && 'ON' || 'OFF' }} \
                -DINPUTLEAP_VERSION_DESC="$VERSION_DESC" \
                -DCMAKE_INSTALL_PREFIX=input-leap-${{ matrix.name }}
          cmake --build build --parallel --target install
        env:
            VERBOSE: 1
            CC: ${{ matrix.cc }}
            CXX: ${{ matrix.cxx }}

      - name: Run the tests
        if: env.B_BUILD_TYPE != 'Release'
        run: |
            ctest --test-dir build --verbose

      - name: Validate Release build and tests
        if: env.B_BUILD_TYPE == 'Release'
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -S input-leap -B release-validation -GNinja \
                -DINPUTLEAP_BUILD_TESTS=ON \
                -DINPUTLEAP_BUILD_LIBEI=${{ (matrix.wayland != 'none') && 'ON' || 'OFF' }} \
                -DINPUTLEAP_VERSION_DESC=release
          cmake --build release-validation --parallel
          xvfb-run -a ctest --test-dir release-validation --output-on-failure

      - name: Create Artifacts
        if: env.B_BUILD_TYPE != 'Release'
        run: tar -cf input-leap-${{matrix.name}}.tar.gz input-leap-${{matrix.name}}

      - name: Upload Artifacts
        if: env.B_BUILD_TYPE != 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: input-leap-${{matrix.name}}
          path: input-leap-${{matrix.name}}.tar.gz
          if-no-files-found: error

      - name: Build Debian package
        if: env.B_BUILD_TYPE == 'Release'
        run: |
          cd input-leap
          cp -r dist/debian debian
          if [ "${{ matrix.wayland }}" = "dist" ]; then
            sed -i -e 's/-DINPUTLEAP_BUILD_LIBEI=0/-DINPUTLEAP_BUILD_LIBEI=ON/g' debian/rules
          fi
          if [ "${{ env.B_BUILD_TYPE }}" = "Release" ]; then
            sed -i -e 's/INPUTLEAP_VERSION_DESC=git/INPUTLEAP_VERSION_DESC=release/g' debian/rules
          fi

          debuild -us -uc

      - name: Upload Artifacts
        if: env.B_BUILD_TYPE == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: input-leap-deb-${{matrix.name}}
          path: input-leap_*.deb
          if-no-files-found: error

  linux-rpm:
    if: ${{ inputs.include_legacy_platforms }}
    name: ${{ matrix.os }}
    runs-on: ubuntu-latest
    container: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["fedora:44", "opensuse/tumbleweed"]
        include:
          - installer: dnf install -y
            rpm_tag: fedora
          - os: opensuse/tumbleweed
            installer: zypper install -y
            rpm_tag: suse_version

    steps:
      - name: Install extra build dependencies
        run: ${{ matrix.installer }} git rpm-build ${{ startsWith(matrix.os, 'fedora:') && 'ninja-build' || 'ninja' }}

      # submodules require git to be installed
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: input-leap
          submodules: recursive
          set-safe-directory: ${{ github.workspace }}

      - name: Install dependencies
        run: |
          # Replace foo >= x with "foo >= x", print only what follows ^BuildRequires
          sed -n 's/\(\S\+ [<>=]\+ [0-9]\+.\?[0-9]\?\)/"\1"/;{s/^BuildRequires: //p}' input-leap/dist/rpm/input-leap.spec.in | xargs ${{ matrix.installer }}

      - name: prep tree
        run: |
          cmake -S input-leap -GNinja -B build -DINPUTLEAP_USE_EXTERNAL_GTEST=True
          ninja -C build package_source

      - name: create target directory
        run: mkdir rpms

      - name:  build SRPM package
        run: |
          rpmbuild -D "_sourcedir $PWD/build" -D "_srcrpmdir ${PWD}/rpms" -bs build/rpm/input-leap.spec

      - name: build RPM package
        run: |
          rpmbuild -D "_sourcedir $PWD/build" -D "_rpmdir $PWD/rpms" -bb build/rpm/input-leap.spec

      - name: Archive RPM package
        uses: actions/upload-artifact@v7
        with:
          name: input-leap-rpms-${{ matrix.rpm_tag }}
          path: |
            rpms/**/*.rpm

  mac-build:
    if: ${{ inputs.include_legacy_platforms }}
    name: ${{ matrix.name}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
       include:
         - name: macOS-Universal
           os: macos-14
           qt-version: 6.8
           qt-modules: ''
           min-macOS-version: 11
           arch: 'arm64;x86_64'
         - name: macOS-Apple_Silicon
           os: macos-14
           qt-version: 6.8
           qt-modules: ''
           min-macOS-version: 14
           arch: 'arm64'

    env:
      VERBOSE: 1
      TERM: xterm-256color
      OpenSSL_Install_Path: "/Users/runner/openssl"
      OpenSSL_Version: 3.2.0

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{matrix.qt-version}}
          modules: ${{matrix.qt-modules}}
          cache: true
          cache-key-prefix: macOS-${{matrix.os}}-Qt${{matrix.qt-version}}

      - name: Setup the image
        run: |
          brew install ninja

      - name: Cache OpenSSL Universal
        id: cache-openssl
        if: matrix.os == 'macos-14'
        uses: actions/cache@v6.1.0
        with:
          path: ${{env.OpenSSL_Install_Path}}
          key: macOS-${{matrix.os}}-ssl-${{matrix.arch}}-${{env.OpenSSL_Version}}

      - name: Build OpenSSL Universal
        if: ((steps.cache-openssl.outputs.cache-hit != 'true') && (matrix.os == 'macos-14'))
        run: |
          wget https://github.com/openssl/openssl/releases/download/openssl-${{env.OpenSSL_Version}}/openssl-${{env.OpenSSL_Version}}.tar.gz
          tar -xf openssl-${{env.OpenSSL_Version}}.tar.gz
          echo "#!/bin/bash
          if [[ \$* == *-arch\ x86_64* ]] && ! [[ \$* == *-arch\ arm64* ]]; then
            cc -arch arm64 \$@
          else
            cc \$@
          fi" >> /Users/runner/cc_override
          chmod a+x /Users/runner/cc_override
          cat /Users/runner/cc_override
          export MACOSX_DEPLOYMENT_TARGET=${{matrix.min-macOS-version}}
          export CC=/Users/runner/cc_override
          cd openssl-${{env.OpenSSL_Version}}
          ./configure no-asm darwin64-x86_64-cc --prefix=${{env.OpenSSL_Install_Path}}
          make
          make install

      - uses: actions/checkout@v7
        with:
          path: input-leap
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement input-leap/tools/requirements-test.txt

      - name: Setup the build
        run: |
          cmake -DCMAKE_BUILD_TYPE="${B_BUILD_TYPE}" -S input-leap -B build -G Ninja \
                -DOpenSSL_ROOT=${{env.OpenSSL_Install_Path}} \
                -DCMAKE_OSX_SYSROOT=$(xcode-select --print-path)/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=${{matrix.min-macOS-version}} \
                -DINPUTLEAP_VERSION_DESC=${{ (env.B_BUILD_TYPE == 'Release') && 'release' || 'git' }} \
                -DCMAKE_OSX_ARCHITECTURES="${{matrix.arch}}"

      - name: Run the build
        run: |
          cmake --build build --parallel
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v7
        if: env.B_BUILD_TYPE == 'Release'
        with:
          name: ${{ matrix.name }}-installer
          path: ./build/bundle/*.dmg
          if-no-files-found: error

      - name: Archive debug app
        if: env.B_BUILD_TYPE != 'Release'
        run: tar -czf InputLeap-${{matrix.name}}.tar.gz -C build/bundle InputLeap.app

      - uses: actions/upload-artifact@v7
        if: env.B_BUILD_TYPE != 'Release'
        with:
          name: ${{ matrix.name }}-debug
          path: ./InputLeap*.tar.gz
          if-no-files-found: error

  win-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
       include:
         - name: Windows Qt6
           os: windows-2022
           qt-version: 6.8
           qt-modules: ''

    steps:
      - uses: actions/checkout@v7
        with:
          path: input-leap
          submodules: recursive

      - name: Select Python interpreter
        shell: pwsh
        run: |
          $pythonExecutable = (python -c "import sys; print(sys.executable)").Trim()
          if (-not (Test-Path -LiteralPath $pythonExecutable)) { throw "Python interpreter not found: $pythonExecutable" }
          "INPUTLEAP_PYTHON_EXECUTABLE=$pythonExecutable" >> $env:GITHUB_ENV

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          & $env:INPUTLEAP_PYTHON_EXECUTABLE -m pip install --disable-pip-version-check --requirement input-leap/tools/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Python test dependency installation failed with exit code $LASTEXITCODE" }

      - name: Download Bonjour SDK-like
        id: bonjour
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Force -ItemType Directory -Path .\deps

          Invoke-WebRequest 'https://github.com/nelsonjchen/mDNSResponder/releases/download/v2019.05.08.1/x64_RelWithDebInfo.zip' -OutFile 'deps\BonjourSDKLike.zip' ;
          $expectedSha256 = 'aad489258d047e396a43efff4270571c82e7da5d33cba1710b784b66fd4011f9'
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath 'deps\BonjourSDKLike.zip').Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -Force 'deps\BonjourSDKLike.zip'
            throw 'Bonjour SDK-like archive checksum verification failed'
          }
          Expand-Archive .\deps\BonjourSDKLike.zip -DestinationPath .\deps\BonjourSDKLike
          Remove-Item deps\BonjourSDKLike.zip

          "path=$env:GITHUB_WORKSPACE\deps\BonjourSDKLike" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{matrix.qt-version}}
          modules: ${{matrix.qt-modules}}
          cache: true
          cache-key-prefix: windows-${{matrix.os}}-Qt${{matrix.qt-version}}

      - name: Configure build system
        run: |
          New-Item -Force -ItemType Directory -Path .\build | Out-Null

          cd build

          cmake -S ..\input-leap -G "$env:CMAKE_GEN" -A x64 -D CMAKE_BUILD_TYPE=$B_BUILD_TYPE `
            -DINPUTLEAP_VERSION_DESC=${{ (env.B_BUILD_TYPE == 'Release') && 'release' || 'git' }} `
            -DINPUTLEAP_PYTHON_EXECUTABLE="$env:INPUTLEAP_PYTHON_EXECUTABLE" `
            -DDNSSD_LIB="$env:BONJOUR_SDK_HOME\Lib\x64\dnssd.lib" -D CMAKE_INSTALL_PREFIX=input-leap-install
        env:
          VS_PATH: '%ProgramFiles%\Microsoft Visual Studio\2022'
          CMAKE_GEN: 'Visual Studio 17 2022'
          BONJOUR_SDK_HOME: ${{ steps.bonjour.outputs.path }}

      - name: Run build system
        run: |
          cmake --build build --config $env:B_BUILD_TYPE --target input-leap-tauri
          if ($LASTEXITCODE -ne 0) { throw "Tauri controller build failed with exit code $LASTEXITCODE" }
          cmake --build build --config $env:B_BUILD_TYPE --target install
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed with exit code $LASTEXITCODE" }
          $env:QT_QPA_PLATFORM = "windows"
          ctest --test-dir build -C $env:B_BUILD_TYPE --output-on-failure

      - name: Create Archive
        run: Compress-Archive -Path build\input-leap-install\* -DestinationPath ${{ env.B_BUILD_TYPE }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ env.B_BUILD_TYPE }}
          path: ${{ env.B_BUILD_TYPE }}.zip
          if-no-files-found: warn

      - name: Build the Installer
        if: env.B_BUILD_TYPE == 'Release'
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp .\build\installer-inno\input-leap.iss

      - name: Smoke-test Windows installer lifecycle
        if: env.B_BUILD_TYPE == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem .\build\installer-inno\bin\InputLeapSetup-*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer artifact was not created' }

          $installDir = Join-Path $env:ProgramFiles 'InputLeap'
          $stateDir = Join-Path $env:ProgramData 'InputLeap'
          $sentinel = Join-Path $stateDir 'installer-smoke-test-preserve.txt'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          Set-Content -LiteralPath $sentinel -Value 'preserve shared state on uninstall'
          $silentArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-')

          foreach ($attempt in 1..2) {
            $install = Start-Process -FilePath $installer.FullName -ArgumentList $silentArgs -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Installer attempt $attempt failed with exit code $($install.ExitCode)" }
            if (-not (Test-Path (Join-Path $installDir 'input-leap-tauri.exe'))) { throw 'Tauri UI missing after install' }
            if (-not (Test-Path (Join-Path $installDir 'input-leapd.exe'))) { throw 'Runtime daemon missing after install' }
            $service = Get-Service -Name 'InputLeap' -ErrorAction SilentlyContinue
            if ($null -eq $service) { throw 'InputLeap service missing after install' }
            if ($service.Status -ne 'Running') { throw "InputLeap service did not start after install: $($service.Status)" }
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing after install' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList $silentArgs -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($remove.ExitCode)" }
          if (Test-Path (Join-Path $installDir 'input-leap-tauri.exe')) { throw 'Application files remain after uninstall' }
          if (Get-Service -Name 'InputLeap' -ErrorAction SilentlyContinue) { throw 'InputLeap service remains after uninstall' }
          if (Get-NetFirewallRule -DisplayName 'InputLeap Listener' -ErrorAction SilentlyContinue) { throw 'InputLeap listener firewall rule remains after uninstall' }
          if (Get-NetFirewallRule -DisplayName 'InputLeap File Transfer' -ErrorAction SilentlyContinue) { throw 'InputLeap file-transfer firewall rule remains after uninstall' }
          if (-not (Test-Path $sentinel)) { throw 'Uninstall removed shared ProgramData; user state must be preserved' }
          Remove-Item -LiteralPath $sentinel -Force

      - uses: actions/upload-artifact@v7
        if: env.B_BUILD_TYPE == 'Release'
        with:
          name: windows-installer-${{ matrix.name }}
          path: .\build\installer-inno\bin
          if-no-files-found: error

  freebsd-build:
    if: ${{ inputs.include_legacy_platforms }}
    name: freebsd-14-3
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build on FreeBSD 14.3
      id: test
      uses: vmactions/freebsd-vm@v1
      with:
        release: 14.3
        usesh: true
        prepare: |
          pkg install -y \
              cmake-core \
              pkgconf \
              git \
              avahi-libdns \
              libsm \
              libxinerama \
              libxrandr \
              libxtst \
              libxkbcommon \
              glib \
              ninja \
              qt6-base \
              qt6-tools \
              qt6-declarative

        run: |
          git config --global --add safe.directory /home/runner/work/input-leap/input-leap
          git submodule update --init --recursive
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DINPUTLEAP_BUILD_INSTALLER=OFF ..
          cmake --build . --parallel

  flatpak:
    if: ${{ inputs.include_legacy_platforms }}
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      # submodules require git to be installed
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - run: git config --global protocol.file.allow always

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        name: "Build"
        with:
          bundle: input-leap.flatpak
          manifest-path: dist/flatpak/io.github.input_leap.input-leap.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        if: env.B_BUILD_TYPE == 'Release'
        with:
          name: input-leap-flatpak-x86_64
          path: input-leap.flatpak
          if-no-files-found: error
