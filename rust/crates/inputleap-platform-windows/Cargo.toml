[package]
name = "inputleap-platform-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
inputleap-protocol-legacy = { path = "../inputleap-protocol-legacy", version = "0.1.0" }
inputleap-control = { path = "../inputleap-control", version = "0.1.0" }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
inputleap-security = { path = "../inputleap-security", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "allow"
