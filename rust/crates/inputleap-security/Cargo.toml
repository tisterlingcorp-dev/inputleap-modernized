[package]
name = "inputleap-security"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
inputleap-types = { path = "../inputleap-types", version = "0.1.0" }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
getrandom = "0.2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = "0.23"
rustls-pki-types = "1"
sha2 = "0.11"
time = "0.3"
webpki = { package = "rustls-webpki", version = "0.103.16" }
zeroize = "1"

[lints]
workspace = true
