[package]
name = "inputleap-runtime"
version = "0.1.0"
description = "Socket runtime adapters for the Input Leap Rust migration"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
inputleap-protocol-legacy = { path = "../inputleap-protocol-legacy", version = "0.1.0" }
inputleap-transfer = { path = "../inputleap-transfer", version = "0.1.0" }
inputleap-types = { path = "../inputleap-types", version = "0.1.0" }
inputleap-update = { path = "../inputleap-update", version = "0.1.0" }
rustls = "0.23"
rustls-pki-types = "1"
base64 = "0.22"
webpki-roots = "0.26"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.11"

[lints]
workspace = true

[dev-dependencies]
rcgen = "0.13"
