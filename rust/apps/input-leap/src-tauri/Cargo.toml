[package]
name = "input-leap-tauri"
version = "0.1.3"
edition = "2021"
license = "GPL-2.0-only"
publish = false

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
inputleap-control = { path = "../../../crates/inputleap-control", version = "0.1.0" }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Services", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
inputleap-platform-windows = { path = "../../../crates/inputleap-platform-windows", version = "0.1.0" }

[workspace]
